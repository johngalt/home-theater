baseurl      = "https://johngalt.github.io/home-theater/"
title        = "My Blog"
languageCode = "en-us"
theme        = "hugo-dead-simple"
paginate = 15

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup.goldmark.renderHooks.image]
useEmbedded = 'fallback'

[markup.goldmark.renderHooks.link]
useEmbedded = 'fallback'

[[module.mounts]]
source = 'assets'
target = 'assets'

[[module.mounts]]
source = 'static'
target = 'assets'
