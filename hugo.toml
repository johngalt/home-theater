baseurl      = "https://johngalt.github.io/home-theater/"
title        = "My Blog"
languageCode = "en-us"
theme        = "hugo-dead-simple"
paginate = 15
enableGitInfo = true

[[menu.main]]
name = "<u>H</u>ome"
url = "/"
weight = 1


[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup.goldmark.renderHooks.image]
useEmbedded = 'always'

[markup.goldmark.renderHooks.link]
useEmbedded = 'always'

[[module.mounts]]
source = 'assets'
target = 'assets'

[[module.mounts]]
source = 'static'
target = 'assets'
